# Developed by Mahir Shah
[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "EditableFlask"
version = "2.0.2"
description = "Editable content regions and a lightweight admin panel for Flask"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Mahir Shah", email = "mahir.shah.sd@gmail.com" }]
keywords = ["flask", "cms", "jinja", "editable-content"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Flask",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "Flask>=3.1.3,<4",
  "Flask-Login>=0.6.3,<1",
]

[project.optional-depencies]
sql = ["Flask-SQLAlchemy>=3.1,<4"]
test = [
  "Flask-SQLAlchemy>=3.1,<4",
  "build>=1.2",
  "pytest>=8,<10",
  "twine>=5,<7",
]

[project.urls]
Homepage = "https://github.com/MahirShah07/EditableFlask"
Documentation = "https://github.com/MahirShah07/EditableFlask#readme"
Issues = "https://github.com/MahirShah07/EditableFlask/issues"
Changelog = "https://github.com/MahirShah07/EditableFlask/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["EditableFlask*"]

[tool.setuptools.package-data]
EditableFlask = ["templates/*.html", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
